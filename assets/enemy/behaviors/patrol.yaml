# Laps between the field's middle (the Capture Point, x 5-7, y 3-5) and our
# opponents' Resupply Zone (blue, x 10.5-12, y 3-5), clockwise: out along
# y ~ 1, under both blue walls, up into the zone, and back along y ~ 1.7.
# Every leg keeps the chassis (0.3 m) at least 0.47 m off the walls. 16.9 m
# a lap, about 14 s at 1.2 m/s.
#
# A behavior is the hub's actor spec (hw-emulator schemas/sim.schema.json
# `actors`) without its name and body, which run.sh fills in: path (world
# [x, y] waypoints, m, the last leg returning to the first), speed (m/s),
# spin (rad/s; 0 faces along the path), turn (m the heading eases over at
# each waypoint), start (s of sim time it waits at the first point).
path:
  - [6.2, 4.2]    # Capture Point
  - [7.6, 3.2]
  - [8.8, 1.0]    # under the blue far wall's end, along y ~ 1
  - [10.6, 1.0]
  - [11.4, 2.2]
  - [11.3, 4.0]   # blue Resupply Zone
  - [10.8, 2.6]
  - [10.2, 1.7]   # back under the blue near wall, along y ~ 1.7
  - [9.0, 1.7]
  - [8.1, 3.1]
  - [6.8, 3.9]
speed: 1.2
spin: 0.0
turn: 0.3
start: 0.0
