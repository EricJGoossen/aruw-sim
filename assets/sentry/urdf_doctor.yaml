# What the sim adds to the vendored sentry URDF (sentry_description/urdf, kept
# unchanged), applied by tools/doctor_urdf.py. The doctored URDFs it writes
# (build/assets/sentry/*.urdf) are the only ones the sim loads.
#
# Every number here is the sim's own. For now most are copied from the robot
# code (each entry's `source` says from where), since there are no separate
# measurements yet; replace them with real measurements here. The sim never
# reads the MCB or otto code: tools/check_model.py compares this file and the
# doctored URDF against it and fails the build, loudly, on any drift.
#
# Lengths are metres, angles radians, rpy is roll-pitch-yaw about fixed
# x, y, z (URDF's convention).

# The vendored URDFs, relative to this file.
urdf:
  mujoco: sentry_description/urdf/sentry_coarse_standalone.urdf   # convex-hull collision meshes
  achilles: sentry_description/urdf/sentry_primitives.urdf        # boxes and cylinders

# The robot drives: a floating base on the 2026 ARC 3v3 field (its own file,
# relative to this one; the world frame is the field's and the MCB's
# odometry's), starting where the MCB's odometry thinks it starts
# (sentry_chassis_constants.hpp INITIAL_CHASSIS_POSITION_X/Y: the red
# Resupply Zone's centre), with the base_footprint on the ground.
world:
  field: ../field/arc2026_3v3.yaml
  spawn: {xyz: [0.75, 4.0, 0.0], rpy: [0, 0, 0]}
  source: mcb sentry_chassis_constants.hpp INITIAL_CHASSIS_POSITION_X/Y

# MuJoCo's URDF importer options. fusestatic must stay false: the frames below
# are fixed links, and fusing them would lose the bodies sensors mount on.
mujoco_compiler: {discardvisual: "false", fusestatic: "false", balanceinertia: "true", strippath: "false"}
mujoco_option: {timestep: "0.001", integrator: "implicitfast"}

# Fixed sensor frames, each a massless link on a fixed joint.
frames:
  # The main MCB rides on the turret major: its MPU6500 and two ISM330s, fused
  # by FusedImuMekfKf. In the code these are in millimetres.
  turret_major_ism330_primary:
    parent: turret_major
    xyz: [-0.0767, -0.11614, 0.0]
    rpy: [0, 0, 0]
    source: mcb sentry_drivers.hpp turretMajorImuTransforms[0] (mm)
  turret_major_ism330_secondary:
    parent: turret_major
    xyz: [-0.0767, 0.11604, 0.0]
    rpy: [0, 0, 3.14159265]
    source: mcb sentry_drivers.hpp turretMajorImuTransforms[1] (mm)
  turret_major_mpu6500:
    parent: turret_major
    xyz: [-0.01497, -0.1155, 0.0]
    rpy: [0, 0, 1.57079633]
    source: mcb sentry_drivers.hpp turretMajorImuTransforms[2] (mm)
  # The chassis MCB (turret-MCB link on CAN2): its IMU feeds chassis odometry.
  # Its firmware applies these mounts itself (the 0x1F5/0x1F6 handshake), so
  # what it reports is in the chassis frame: the sim's sensor sits at
  # chassis_mcb_frame, and the board's own mounts are kept here for the check.
  chassis_mcb_frame: {parent: base_link, xyz: [0, 0, 0], rpy: [0, 0, 0], source: "chassis frame (turret MCB output frame)"}
  chassis_mcb_bmi088:
    parent: base_link
    xyz: [0.04117, 0.0, 0.04945]
    rpy: [0, 0, 0]
    source: mcb sentry_chassis_constants.hpp CHASSIS_MCB_BMI088_MOUNTING_TRANSFORM
  chassis_mcb_ism330:
    parent: base_link
    xyz: [0.09811, 0.0, 0.003253]
    rpy: [0, 0, 0]
    source: mcb sentry_chassis_constants.hpp CHASSIS_MCB_ISM330_MOUNTING_TRANSFORM
  # The widow turret MCB (CAN1), on the minor's firing system; as above, its
  # output is in the turret frame.
  turret_mcb1_frame: {parent: turret_minor_firing_system, xyz: [0, 0, 0], rpy: [0, 0, 0], source: "turret frame (turret MCB output frame)"}
  turret_mcb1_bmi088:
    parent: turret_minor_firing_system
    xyz: [0.0, 0.20667, 0.0]
    rpy: [0, 0, -3.1415926535]
    source: mcb sentry_turret_constants.hpp TURRET_MCB1_BMI088_MOUNTING_TRANSFORM
  turret_mcb1_ism330:
    parent: turret_minor_firing_system
    xyz: [0.00868, 0.1734, 0.0]
    rpy: [0, 0, -1.5707963]
    source: mcb sentry_turret_constants.hpp TURRET_MCB1_ISM330_MOUNTING_TRANSFORM
  # Cameras (pose: x forward, y left, z up, as hw-emulator's camera elements).
  turret_camera:
    parent: turret_minor_firing_system
    xyz: [0.13552, 0.0325, 0.04885]
    rpy: [0.0, 0.0, 0.0]
    source: otto sentry_name_config.yaml turret_geometry.0.turret_reference_to_camera_transform
  arducam:
    parent: base_link
    xyz: [0.008, -0.172, 0.0]
    rpy: [0.0, 0.0, -1.5707]
    source: otto sentry_name_config.yaml arducam_cameras[0].base_reference_to_camera_transform
    note: otto's "base reference" is taken to be the chassis (base_link) -- check
  # The two LD19 lidars (otto autonav).
  # The LD19s' scan plane is 46 mm up in base_link (109 mm off the ground):
  # the open band in the chassis CAD above each LD19's base, where its head
  # looks out (meshes/visual/chassis.stl); x and y are otto's.
  lidar_front:
    parent: base_link
    xyz: [0.135, 0.0, 0.046]
    rpy: [0.0, 0.0, -1.5707]
    source: otto sentry_name_config.yaml autonav.lidars[0] (port 1-4.1:1.0)
  lidar_back:
    parent: base_link
    xyz: [-0.135, 0.0, 0.046]
    rpy: [0.0, 0.0, 1.5707]
    source: otto sentry_name_config.yaml autonav.lidars[1] (port 1-4.4:1.0)

# Visuals drawn in place of the primitives URDF's (Achilles draws visuals;
# MuJoCo, which draws collision shapes, never sees these). Each replaces its
# link's visuals with its collision shapes (from_collision, in rgba), with
# shapes (box, cylinder or sphere, each with xyz, rpy, rgba), or with the
# one shape given inline; the collision shapes stay as they are.
visual_overrides:
  base_link:
    # The fitted chassis (collision_overrides), so the cameras see what the
    # engines collide with and the lidars see -- the open band included.
    from_collision: true
    rgba: [0.15, 0.15, 0.15, 1.0]
  lidar_front: &ld19
    # An LD19 (54 x 46 x 35 mm): its base below the scan plane, its turning
    # head on it (the frame's origin). Visual only: nothing collides with it.
    shapes:
      - {box: [0.054, 0.046, 0.020], xyz: [0.0, 0.0, -0.016], rgba: [0.08, 0.08, 0.08, 1.0]}
      - {cylinder: {radius: 0.019, length: 0.0148}, xyz: [0.0, 0.0, 0.0014], rgba: [0.35, 0.35, 0.38, 1.0]}
    source: LD19 datasheet outline (54 x 46.3 x 34.8 mm); head size estimated
  lidar_back: *ld19
  turret_minor_firing_system:
    # The URDF's 272 x 60 x 60 mm block swallows the turret camera's mount
    # (2.5 mm outside its side, inside its height, 54 mm of it in front of
    # the lens), so the RealSense saw a wall. Drawn as the barrel instead:
    # a 21 mm tube on the block's axis, the same length.
    cylinder: {radius: 0.0105, length: 0.272}
    xyz: [0.054, 0.0, 0.030]
    rpy: [0.0, 1.5707963, 0.0]
    rgba: [0.75, 0.75, 0.75, 1.0]
    source: approximation (the launcher's CAD isn't in the primitives URDF)

# Collision shapes replacing the vendored URDFs' -- the primitives' boxes
# and the coarse one's convex hulls -- in both, so both engines collide with,
# and their lidars see, the same robot. Each replaces its link's collision
# shapes.
collision_overrides:
  base_link:
    # Fitted to the chassis hull (meshes/collision/chassis.stl): a tapered
    # octagon, 585 mm across the flats at its widest with its corners cut,
    # narrowing toward the top. The URDF's box is the full 585 mm square
    # 160 mm tall, so its corners stuck out ~12 cm and it missed the top
    # 70 mm. Two octagonal layers, from the hull's sections at z = 0.05 and
    # 0.15 (base_link frame): half-widths in x and y, and |x| + |y| <= chamfer.
    # The lidars' scan plane (z = 0.046) runs through an open band, 30 to
    # 62 mm: on the robot the LD19s look out between the chassis plates, so
    # in that band only what really reaches the plane -- the wheels'
    # rollers, the armor -- blocks them.
    octagon_layers:
      - {z: [-0.025, 0.030], half: [0.28, 0.282], chamfer: 0.40}
      - {z: [0.062, 0.09], half: [0.28, 0.282], chamfer: 0.40}
      - {z: [0.09, 0.196], half: [0.248, 0.256], chamfer: 0.35}
    source: fitted to chassis.stl (z -0.034 to 0.196; the underside's 25 mm chamfer below z = -0.01 is left square)

# Omni wheels: the vendored wheels are solid, so each gets passive rollers
# around its rim (two staggered rows, so one is always in contact), and the
# wheel's own collision shape is removed: the rollers are what touch the floor.
omni_wheels:
  wheels: [fl_wheel, fr_wheel, bl_wheel, br_wheel]
  wheel_radius: 0.07586        # the vendored primitives' wheel cylinder (outer radius)
  rollers_per_row: 9
  rows: 2
  row_spacing: 0.032           # along the axle, between the two rows' centres (more than a roller diameter, so rows never touch)
  roller_shape: sphere         # no edges to catch the floor; two staggered rows keep the
                               # rolling radius within ~1 mm of the wheel's
  roller_radius: 0.014
  roller_length: 0.028         # cylinder rollers only
  roller_mass: 0.012
  roller_friction_damping: 0.0001
  roller_rgba: [0.08, 0.08, 0.08, 1.0]  # Achilles draws the rollers, the wheel as its hub inside them
  estimated: true              # roller sizes estimated from the omni_wheel mesh

# Flywheels and the agitator: the firmware closes speed and position loops on
# them, but the vendored URDF has no such links. Masses and inertias estimated.
mechanisms:
  flywheel_left:
    parent: turret_minor_firing_system
    xyz: [0.10, 0.03, 0.03]
    axis: [0, 0, 1]
    mass: 0.10
    inertia: [4.0e-5, 4.0e-5, 6.0e-5]
    estimated: true
  flywheel_right:
    parent: turret_minor_firing_system
    xyz: [0.10, -0.03, 0.03]
    axis: [0, 0, -1]
    mass: 0.10
    inertia: [4.0e-5, 4.0e-5, 6.0e-5]
    estimated: true
  agitator:
    parent: turret_minor_frame
    xyz: [0.0, 0.0, 0.18]
    axis: [0, 0, 1]
    mass: 0.15
    inertia: [1.5e-4, 1.5e-4, 2.5e-4]
    estimated: true

# Armor plates, for otto's detector: RMUL small armor (plate 135 x 125 mm)
# with a light bar along each side. Placement on the sentry estimated from the
# chassis mesh (four plates, one per side, tilted back 15 degrees).
armor:
  team_color: blue             # the light bars: blue or red
  plate: {width: 0.135, height: 0.125, thickness: 0.004, rgba: [0.15, 0.15, 0.15, 1]}
  light_bar: {width: 0.012, height: 0.055, thickness: 0.008, offset: 0.0735}
  sticker: {width: 0.06, height: 0.07, rgba: [0.9, 0.9, 0.9, 1]}
  plates:
    armor_front: {parent: base_link, xyz: [0.30, 0.0, 0.10], rpy: [0, 0.2618, 0], id: 7}
    armor_left:  {parent: base_link, xyz: [0.0, 0.30, 0.10], rpy: [0, 0.2618, 1.5708], id: 7}
    armor_back:  {parent: base_link, xyz: [-0.30, 0.0, 0.10], rpy: [0, 0.2618, 3.1416], id: 7}
    armor_right: {parent: base_link, xyz: [0.0, -0.30, 0.10], rpy: [0, 0.2618, -1.5708], id: 7}
  estimated: true
