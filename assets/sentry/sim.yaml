# The sentry's hub. scripts/run.sh starts it, the MCB and otto; it picks
# the backend (default achilles) and the runtime directory.
backend: achilles
display: headless
seed: 1
models:
  # Generated by tools/doctor_urdf.py and Achilles's tools/urdf_to_arow.py
  # from sentry_description/ and urdf_doctor.yaml (scripts/build.sh).
  urdf: ../../build/assets/sentry/sentry_mujoco.urdf
  arow: ../../build/assets/sentry/achilles/sentry.arow
  achilles_config: achilles_config.yaml
achilles:
  integrator: semi_implicit_euler
mujoco:
  elements:
    # The chassis's convex hull encloses the wheels: no contacts between it
    # and the wheels or their rollers (a URDF can't say so).
    chassis_wheel_exclude: {type: exclude, body1: base_link, body2: "*_wheel"}
    chassis_roller_exclude: {type: exclude, body1: base_link, body2: "*_roller_*"}
    # The rollers' tiny inertia needs some armature to stay stable at 1 ms.
    roller_joints: {type: joint, joints: "*_roller_*_spin", armature: 0.00002}
clock:
  mode: realtime
  dt: 0.001
  rate: 1.0
status_period: 0
# Ground truth for checking a run (scripts/autonav_check.py): the chassis's
# footprint pose every 10 ms of sim time, to <run dir>/truth.jsonl.
truth_log:
  period: 0.01
  body: {achilles: sentry/floating_base, mujoco: base_footprint}
  # joint_major's angle: otto's "chassis" odometry is the turret major's
  # pose (SentryTransformAdapter::getVisionWorldToChassis), so its true yaw
  # is the chassis's plus this.
  encoders: [major_yaw_encoder]
# The windows run.sh --window opens; headless, the hub ignores them. Each is
# a sensor's view (view: image or depth for a camera, lidar for a lidar, plot
# for a reading or a motor), and each costs the hub time on every draw. The
# lidars aren't shown: they're mounted inside the chassis, so for now every
# return is the robot itself.
windows:
  - {sensor: turret_camera_image, view: image, title: "RealSense (turret)"}
